name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Summarize dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync("/tmp/npm-audit.json","utf8")); console.log("Audit totals:", JSON.stringify(a.metadata?.vulnerabilities)); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+": "+v.severity+"; range="+v.range+"; fix="+JSON.stringify(v.fixAvailable)+"; via="+JSON.stringify(v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range,url:x.url})));'
      - name: Check development launcher syntax
        run: node --check scripts/dev.js
      - name: Validate Codespaces Compose configuration
        run: docker compose -f .devcontainer/compose.yaml config --quiet
      - name: Check API source syntax
        run: find server/src -name '*.js' -print0 | xargs -0 -n 1 -P 4 node --check
      - name: Build frontend
        run: npm run build
      - name: Test workspaces
        run: npm test
      - name: Check signed book payments against a MongoDB replica set
        timeout-minutes: 5
        run: |
          docker run -d --name capture-mongo -p 127.0.0.1:27018:27017 mongo:7 --replSet rs0 --bind_ip_all
          trap 'docker rm -f capture-mongo' EXIT
          for i in {1..40}; do
            if docker exec capture-mongo mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec capture-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in {1..40}; do
            if docker exec capture-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then break; fi
            sleep 1
          done
          node --test server/integration/razorpay-capture.mjs
